server:
  port: 8080

spring:
  application:
    name: invest-backend
  profiles:
    active: mysql

---
# 仅用于快速联调/跑单元测试，不需要装 MySQL 也能启动：内嵌 H2（MySQL 兼容模式）。
# 正式后端一律用下面的 mysql profile——已设为默认，`mvn spring-boot:run` 不用加任何参数
# 就是连 MySQL；只有显式传 --spring.profiles.active=local 才会切回这个临时 H2。
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:investdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:seed-data.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# 默认生效的 profile：数据库就是 MySQL，不是内嵌/临时数据库。
# 首次使用前，先拿 sql/schema.sql 在你的 MySQL 里建库建表（本 profile 不会自动建表/灌数据，
# 见下面 sql.init.mode: never），需要示例数据的话再手动执行一遍 sql/seed-data.sql。
# 连接信息全部走环境变量，默认值只是本机联调占位：DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:invest}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
  sql:
    init:
      mode: never   # 生产库结构用 sql/schema.sql 手动执行或走迁移工具（Flyway/Liquibase）管理
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

app:
  # MVP 阶段未接入登录鉴权，所有请求视为同一用户（见 CurrentUserProvider）。
  # 接入 JWT 后，将 CurrentUserProvider 替换为从 SecurityContext 解析真实 userId。
  default-user-id: 1
