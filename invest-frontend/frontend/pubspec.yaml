name: fuli_invest
description: 复利 - 股票/期货/期权交易日志与资金曲线（前后端分离，本地数据库缓存最新接口数据）
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.5.0            # HTTP 客户端，统一在 network/api_client.dart 里配置拦截器
  sqflite: ^2.3.3        # 本地缓存数据库：把后端接口最新返回的 JSON 缓存下来，弱网/离线时兜底展示
  path: ^1.9.0           # 拼本地数据库文件路径
  intl: ^0.19.0          # 日期/金额格式化

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
